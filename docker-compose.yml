services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-riddler}
      POSTGRES_USER: ${POSTGRES_USER:-riddler}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - riddler_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB""]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s
    stop_grace_period: 30s
  server:
    profiles: ["full"]
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      STORAGE_TYPE: postgres
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-riddler}
      DB_USER: ${POSTGRES_USER:-riddler}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
      PORT: 7070
    ports:
      - "${HTTP_PORT:-7070}:7070"
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 35s
volumes:
  riddler_pgdata:
